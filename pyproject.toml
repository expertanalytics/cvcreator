[tool.poetry]
name = "cvcreator"
version = "1.2.0"
description = "An automated tool for creating CVs on the fly."
authors = ["Jonathan Feinberg <jonathf@gmail.com>"]
license = "mit"
include = ["cvcreator/templates/*", "cvcreator/icons/*"]
readme="README.rst"

[tool.poetry.dependencies]
python = ">=3.10"
toml = "^0.10.2"
PyYAML = "^6.0.2"
pydantic = ">=1.10.13,<2.0.0"
Jinja2 = ">=3.1.6,<4.0.0"
click = "^8.0.1"
click-help-colors = "^0.9"
markupsafe = ">=2.1.5"
pycountry = "^20.7.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"

[tool.poetry.scripts]
cv = "cvcreator.parser:cv"
cvcreate = "cvcreator.parser:create"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
